name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Match tag to VERSION
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - name: Install validator dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Rebuild and compare deterministic archive
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          python tools/build_release.py --output "work/orchestrate-agent-organization-v${version}.zip" --checksum-output work/SHA256SUMS
          cmp "work/orchestrate-agent-organization-v${version}.zip" "dist/orchestrate-agent-organization-v${version}.zip"
          test "$(sha256sum "work/orchestrate-agent-organization-v${version}.zip" | cut -d' ' -f1)" = "$(cut -d' ' -f1 SHA256SUMS | tr 'A-F' 'a-f')"
      - name: Validate release
        run: python tools/validate_release.py
      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Persistent AI Studio $GITHUB_REF_NAME" --generate-notes "dist/orchestrate-agent-organization-v${version}.zip" SHA256SUMS
